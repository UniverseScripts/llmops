apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-node
  template:
    metadata:
      labels:
        app: llm-node
    spec:
      containers:
        - name: fastapi-server
          image: llm-enterprise:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:

name: Enterprise Node Audit

on:
  push:
    branches:
      - enterprise-saas-mor
  pull_request:
    branches:
      - enterprise-saas-mor

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compile and Syntax Check
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: llmops-enterprise:ci-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Audit Kubernetes
        run: |
          echo "Validating K3s Syntax..."
          kubectl apply --dry-run=client -f k8s/base/state/
          kubectl apply --dry-run=client -f k8s/base/observability/
  